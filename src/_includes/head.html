<meta charset="UTF-8" />
<link rel="icon" href="/img/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>
<title>{{ brand.name }}</title>
<link rel="stylesheet" href="/css/style.css" />
<link
  rel="preload"
  as="fetch"
  href="/plugin-sdk/{{ pluginSdk.fileName }}"
  crossorigin="anonymous"
/>
<!-- SEO tags -->
<meta property="og:type" content="website" />
<meta property="og:title" content="{{ brand.name }}" />
<meta property="og:description" content="{{ brand.description }}" />
<meta
  property="og:image"
  content="https://{{ brand.host }}{{ brand.ogImageUrl }}"
/>
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ brand.name }}" />
<meta
  name="twitter:image"
  content="https://{{ brand.host }}{{ brand.ogImageUrl }}"
/>
<!-- End SEO tags -->
<script>
  // Inject environment variables from 11ty
  window.env = {
    hostName: "{{ hostName }}",
    gitCommit: "{{ gitCommit }}",
    environment: "{{ environment }}",
    version: "{{ version }}",
    pluginSdkFileName: "{{ pluginSdk.fileName }}",
    oauthScopes: "{{ oauthScopes }}",
    oauthOptionalScopes: "{{ oauthOptionalScopes }}",
    playwright: "{{ playwright }}" === "true",
    oauthAssertionUrl: "{{ oauthAssertionUrl }}",
    reportLoads: "{{ reportLoads }}" === "true",
  };
</script>
<script>
  import("/js/theme.js").then(({ theme }) => {
    // Apply theme separately so it applies even if the other JS fails somehow.
    // We could make this synchronous but it's not worth the effort for now.
    theme.apply();
  });
</script>
