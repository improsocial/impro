<!doctype html>
<html lang="en">
  <head>
    {% include "head.html" %}
    <link rel="modulepreload" href="/js/boot.js" />
  </head>
  <body>
    <div id="app-root"></div>
    <div id="boot-state" class="boot-state-layer" hidden></div>

    <script>
      const bootStateElement = document.getElementById("boot-state");

      window.bootUi = {
        // "init" -> "loading" (still booting after 1s) -> "ready" (app
        // finished loading) or "error" (scripts failed to load, bootstrap
        // threw, or timeout).
        state: "init",

        showLoading() {
          this.state = "loading";
          bootStateElement.innerHTML = /* html */ `
            <div class="app-loading-state" data-testid="boot-loading">
              <div class="app-loading-state-content">
                <div class="loading-spinner"></div>
              </div>
            </div>
          `;
          bootStateElement.hidden = false;
        },

        showError() {
          this.state = "error";
          bootStateElement.innerHTML = /* html */ `
            <div class="error-state app-error-state" data-testid="boot-error">
              <div>There was an error loading the app.</div>
              <button
                class="rounded-button rounded-button-secondary-inverted"
                onclick="window.location.reload()"
              >
                Try again
              </button>
            </div>
          `;
          bootStateElement.hidden = false;
        },

        ready() {
          this.state = "ready";
          bootStateElement.hidden = true;
          bootStateElement.innerHTML = "";
        },
      };

      setTimeout(() => {
        if (window.bootUi.state === "init") {
          window.bootUi.showLoading();
        }
      }, 1000);

      setTimeout(() => {
        if (
          window.bootUi.state === "init" ||
          window.bootUi.state === "loading"
        ) {
          window.bootUi.showError();
        }
      }, 10000);
    </script>

    <script type="module">
      // Reload when a newer version is deployed
      const RELOAD_GUARD_KEY = "version-check-last-reload";
      const RELOAD_GUARD_MS = 60 * 1000;

      async function fetchDeployedVersion() {
        try {
          const response = await fetch("/version.json", { cache: "no-store" });
          if (!response.ok) {
            return null;
          }
          const data = await response.json();
          return data.version ?? null;
        } catch {
          return null;
        }
      }

      async function reloadIfOutdated() {
        const deployedVersion = await fetchDeployedVersion();
        if (
          deployedVersion === null ||
          deployedVersion === window.env.version
        ) {
          return;
        }
        // Guard against a reload loop if the server keeps returning stale HTML
        const lastReload = Number(sessionStorage.getItem(RELOAD_GUARD_KEY));
        if (lastReload && Date.now() - lastReload < RELOAD_GUARD_MS) {
          console.warn(
            `Deployed version ${deployedVersion} differs from running version ${window.env.version}, but a reload was already attempted recently - skipping`,
          );
          return;
        }
        sessionStorage.setItem(RELOAD_GUARD_KEY, String(Date.now()));
        window.location.reload();
      }

      reloadIfOutdated();
      window.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          reloadIfOutdated();
        }
      });
      window.addEventListener("pageshow", (event) => {
        if (event.persisted) {
          reloadIfOutdated();
        }
      });
    </script>

    <script
      type="module"
      src="/js/boot.js"
      onerror="window.bootUi.showError()"
    ></script>
  </body>
</html>
